name: Deploy (Dev)
on:
  push: null
env:
  CARGO_TERM_COLOR: always
  DOCKER_REPO: leonardoarcari/dcapal
  IP2LOCATION_FILENAME: IP2LOCATION-LITE-DB5.IPV6.BIN
jobs:
  optimizer-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@v2
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Toolchain info
      run: 'cargo --version --verbose

        rustc --version

        '
    - name: Build
      run: 'wasm-pack build --release dcapal-optimizer-wasm

        '
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: dcapal-frontend/package-lock.json
    - name: Install dependencies
      run: 'cd dcapal-frontend

        npm ci

        '
    - name: Configure .env.production
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_DEV }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_DEV }}
      run: 'cat > dcapal-frontend/.env.production << EOF

        REACT_APP_ENABLE_COOKIE_BUTTON=0

        VITE_SUPABASE_URL=${VITE_SUPABASE_URL}

        VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}

        EOF

        '
    - name: Build
      run: 'cd dcapal-frontend

        npm run build

        '
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Deploy dcapal-frontend
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_KEY }}
        source: dcapal-frontend/dist
        target: ${{ secrets.WEB_DIR_DEV }}
        strip_components: 2
    - name: Download IP2Location database
      uses: cloudflare/wrangler-action@v3
      with:
        packageManager: npm
        apiToken: ${{ secrets.CF_R2_API_TOKEN }}
        accountId: ${{ secrets.CF_R2_ACCOUNT_ID }}
        workingDirectory: dcapal-backend/data/dcapal
        command: r2 object get ip2location-db/${{ env.IP2LOCATION_FILENAME }}.zip
    - name: Deploy IP2Location database
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_KEY }}
        source: dcapal-backend/data/dcapal
        target: ${{ secrets.DCAPAL_DIR_DEV }}
        strip_components: 1
    - name: Unpack IP2Location database
      uses: appleboy/ssh-action@master
      env:
        DCAPAL_DIR: ${{ secrets.DCAPAL_DIR_DEV }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_KEY }}
        envs: DCAPAL_DIR,IP2LOCATION_FILENAME
        script: 'cd ${DCAPAL_DIR}/data/dcapal

          ls -la

          unzip ${IP2LOCATION_FILENAME}.zip -d ip2location

          mv ip2location/${IP2LOCATION_FILENAME} .

          rm -rf ip2location

          rm ${IP2LOCATION_FILENAME}.zip

          ls -la

          '
    - name: Configure docker-compose.yml
      env:
        REDIS_PORT: ${{ secrets.REDIS_PORT_DEV }}
      run: "cat > dcapal-backend/docker-compose.yml << EOF\nversion: \"3.9\"\nservices:\n  redis:\n  \
        \  image: redis/redis-stack-server\n    container_name: redis-dev\n    restart: always\n    ports:\n\
        \      - ${REDIS_PORT}:6379\n    networks:\n      - dcapal-dev-network\n    volumes:\n      -\
        \ ./config/redis/redis-stack.conf:/redis-stack.conf\n      - ./config/redis/users.acl:/etc/redis/users.acl\n\
        \      - ./data/redis/:/data\n    healthcheck:\n      test: redis-cli --raw ping\n      interval:\
        \ 10s\n      timeout: 10s\n      retries: 3\n\nnetworks:\n  dcapal-dev-network:\nEOF\n"
    - name: Configure docker-compose.prod.yml
      env:
        DCAPAL_API_PORT: ${{ secrets.DCAPAL_API_PORT_DEV }}
        DCAPAL_METRICS_PORT: ${{ secrets.DCAPAL_METRICS_PORT_DEV }}
      run: "cat > dcapal-backend/docker/docker-compose.prod.yml << EOF\nversion: \"3.9\"\nservices:\n\
        \  dcapal:\n    image: leonardoarcari/dcapal:dev\n    env_file: dcapal.env\n    restart: always\n\
        \    ports:\n      - ${DCAPAL_API_PORT}:8080\n      - ${DCAPAL_METRICS_PORT}:9000\n    networks:\n\
        \      - dcapal-dev-network\n    volumes:\n      - ./dcapal.yml:/var/dcapal/dcapal-backend/dcapal.yml\n\
        \      - ./data/dcapal:/var/dcapal/dcapal-backend/data\n    depends_on:\n      redis:\n      \
        \  condition: service_healthy\n    healthcheck:\n      test: curl --fail http://localhost:8080\
        \ || exit 1\n      interval: 10s\n      timeout: 10s\n      retries: 5\nEOF\n"
    - name: Configure Redis ACL
      env:
        REDIS_USER: ${{ secrets.REDIS_USER }}
        REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        REDIS_ADMIN: ${{ secrets.REDIS_ADMIN }}
        REDIS_ADMIN_PASSWORD: ${{ secrets.REDIS_ADMIN_PASSWORD }}
      run: 'cat > dcapal-backend/config/redis/users.acl << EOF

        user ${REDIS_USER} +@all -@dangerous ~* on >${REDIS_PASSWORD}

        user ${REDIS_ADMIN} ~* &* +@all on >${REDIS_ADMIN_PASSWORD}

        user default off

        EOF

        '
    - name: Configure dcapal.yml
      env:
        DCAPAL_CW_API_KEY: ${{ secrets.DCAPAL_CW_API_KEY }}
        DCAPAL_IP_API_KEY: ${{ secrets.DCAPAL_IP_API_KEY }}
        DCAPAL_CMC_API_KEY: ${{ secrets.DCAPAL_CMC_API_KEY }}
        JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
        REDIS_USER: ${{ secrets.REDIS_USER }}
        REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        POSTGRES_HOSTNAME: ${{ secrets.POSTGRES_HOSTNAME_DEV }}
        POSTGRES_PORT: ${{ secrets.POSTGRES_PORT_DEV }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER_DEV }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_DEV }}
        POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE_DEV }}
      run: "cat > dcapal-backend/dcapal.yml << EOF\napp:\n  providers:\n    priceProvider: kraken\n  \
        \  cwApiKey: ${DCAPAL_CW_API_KEY}\n    ipApiKey: ${DCAPAL_IP_API_KEY}\n    cmcApiKey: ${DCAPAL_CMC_API_KEY}\n\
        \  auth:\n    jwtSecret: ${JWT_SECRET}\n\n  services:\n    ip:\n      dbPath: data/${IP2LOCATION_FILENAME}\n\
        \n  log:\n    level: dcapal_backend=info,tower_http=debug\n    file: data/dcapal.log\n    enableStdout:\
        \ false\n\nserver:\n  web:\n    hostname: 0.0.0.0\n    port: 8080\n  metrics:\n    hostname: 0.0.0.0\n\
        \    port: 9000\n  redis:\n    hostname: redis\n    port: 6379\n    user: ${REDIS_USER}\n    password:\
        \ ${REDIS_PASSWORD}\n  postgres:\n    hostname: ${POSTGRES_HOSTNAME}\n    port: ${POSTGRES_PORT}\n\
        \    user: ${POSTGRES_USER}\n    password: ${POSTGRES_PASSWORD}\n    database: ${POSTGRES_DATABASE}\n\
        EOF\n"
    - name: Configure dotenv
      env:
        POSTGRES_HOSTNAME: ${{ secrets.POSTGRES_HOSTNAME_DEV }}
        POSTGRES_PORT: ${{ secrets.POSTGRES_PORT_DEV }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER_DEV }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_DEV }}
        POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE_DEV }}
      run: 'cat > dcapal-backend/dcapal.env << EOF

        DB_HOST: ${POSTGRES_HOSTNAME}

        DB_PORT: ${POSTGRES_PORT}

        APP_USER: ${POSTGRES_USER}

        APP_USER_PWD: ${POSTGRES_PASSWORD}

        APP_DB_NAME: ${POSTGRES_DATABASE}

        EOF

        '
    - name: Deploy dcapal-backend config
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_KEY }}
        source: dcapal-backend/config,dcapal-backend/docker/docker-compose.prod.yml,dcapal-backend/docker-compose.yml,dcapal-backend/dcapal.yml,dcapal-backend/dcapal.env
        target: ${{ secrets.DCAPAL_DIR_DEV }}
        strip_components: 1
    - name: Deploy dcapal-backend
      uses: appleboy/ssh-action@master
      env:
        DCAPAL_DIR: ${{ secrets.DCAPAL_DIR_DEV }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        port: ${{ secrets.SSH_PORT }}
        key: ${{ secrets.SSH_KEY }}
        envs: DCAPAL_DIR
        script: 'cd ${DCAPAL_DIR}

          ls -la

          mkdir -p ./data/dcapal

          touch ./data/dcapal/dcapal.log

          docker compose -f docker-compose.yml -f ./docker/docker-compose.prod.yml pull

          docker compose -f docker-compose.yml -f ./docker/docker-compose.prod.yml down

          docker compose -f docker-compose.yml -f ./docker/docker-compose.prod.yml up -d

          '
